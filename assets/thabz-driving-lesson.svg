<path d="M399 623 492 494 Q509 468 551 468 H632 V623Z" fill="#7da99d" stroke="#183d2b" stroke-width="9" stroke-linejoin="round"/>
<path d="M651 468 H778 Q815 470 843 505 L946 623 H651Z" fill="#8cb8b0" stroke="#183d2b" stroke-width="9" stroke-linejoin="round"/>
<path d="M642 470V625" stroke="#183d2b" stroke-width="10"/>
