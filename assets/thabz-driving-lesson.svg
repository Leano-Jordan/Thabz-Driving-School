<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">Black South African learner driving with an instructor</title>
<desc id="desc">A warm editorial illustration of a Black learner driver and Black driving instructor practising together in a modern training car, with a South African landscape in the background.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f1e6"/><stop offset="1" stop-color="#c9dfcc"/></linearGradient>
 <linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#dce6de"/></linearGradient>
 <linearGradient id="seat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c543c"/><stop offset="1" stop-color="#0b3022"/></linearGradient>
</defs>
<rect width="1200" height="1000" fill="url(#sky)"/>
<circle cx="960" cy="160" r="76" fill="#ffc247" opacity=".9"/>
<path d="M0 510 Q160 390 340 500 T710 475 T1200 430 V1000 H0Z" fill="#b7d0b4"/>
<path d="M0 610 Q220 500 440 590 T870 565 T1200 540 V1000 H0Z" fill="#719c7c"/>
<path d="M0 760 Q230 690 470 760 T900 725 T1200 740 V1000 H0Z" fill="#315f45"/>
<!-- distant acacia silhouettes -->
<g fill="#315f45" opacity=".75"><path d="M130 530h12v-65l-6-32-6 32z"/><path d="M78 445q10-38 36-28 26-19 42 4 30-3 28 25-29 17-106 0z"/><path d="M1030 510h12v-72l-6-34-6 34z"/><path d="M976 424q12-35 38-25 25-19 42 5 31-2 29 24-29 17-109 0z"/></g>
